name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: 'Type "PUBLISH" to confirm publishing to PyPI'
        required: true
        default: ""

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Creating the GitHub Release for the version.
      contents: write
    environment: production # Optional: use environment for additional security

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Verify confirmation (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm_publish }}" != "PUBLISH" ]; then
            echo "❌ Confirmation not received. You must type 'PUBLISH' to confirm."
            exit 1
          fi
          echo "✅ Confirmation received for manual publish"

      - name: Make publish script executable
        run: chmod +x publish.sh

      - name: Set up PyPI token
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          # Create .pypirc file for twine authentication
          mkdir -p ~/.pypi
          cat > ~/.pypirc << EOF
          [distutils]
          index-servers = pypi

          [pypi]
          repository = https://upload.pypi.org/legacy/
          username = __token__
          password = $PYPI_API_TOKEN
          EOF

      - name: Publish to PyPI
        env:
          GITHUB_ACTIONS: true
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          # Run the publish script in non-interactive mode
          ./publish.sh

      # Skip if the release exists: creating one in the UI also pushes the tag,
      # and that is what triggers this workflow in the first place.
      - name: Create the GitHub Release unless it exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists. Skipping."
          else
            gh release create "$TAG" dist/*.whl dist/*.tar.gz \
              --generate-notes --target "$GITHUB_SHA"
          fi
