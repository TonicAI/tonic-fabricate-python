name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: 'Type "PUBLISH" to confirm publishing to PyPI'
        required: true
        default: ""

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      # Creating the GitHub Release for the version.
      contents: write
    environment: production # Optional: use environment for additional security

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Verify confirmation (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm_publish }}" != "PUBLISH" ]; then
            echo "❌ Confirmation not received. You must type 'PUBLISH' to confirm."
            exit 1
          fi
          echo "✅ Confirmation received for manual publish"

      # The tag is the source of truth for the version; the files in the repo
      # carry whatever was last committed. These edits live and die with the
      # runner.
      - name: Set the version from the tag
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Run this workflow from a v* tag, not $GITHUB_REF."
            exit 1
          fi
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag $GITHUB_REF_NAME is not a version like v1.2.3."
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          sed -i "s/^__version__ = \".*\"/__version__ = \"$VERSION\"/" tonic_fabricate/__init__.py
          grep -n '^version = ' pyproject.toml
          grep -n '^__version__ = ' tonic_fabricate/__init__.py

      - name: Make publish script executable
        run: chmod +x publish.sh

      - name: Set up PyPI token
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          # Create .pypirc file for twine authentication
          mkdir -p ~/.pypi
          cat > ~/.pypirc << EOF
          [distutils]
          index-servers = pypi

          [pypi]
          repository = https://upload.pypi.org/legacy/
          username = __token__
          password = $PYPI_API_TOKEN
          EOF

      - name: Publish to PyPI
        env:
          GITHUB_ACTIONS: true
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          # Run the publish script in non-interactive mode
          ./publish.sh

      # Skip if the release exists: creating one in the UI also pushes the tag,
      # and that is what triggers this workflow in the first place.
      - name: Create the GitHub Release unless it exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists. Skipping."
          else
            gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz \
              --generate-notes --verify-tag
          fi
